<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуальный тест отправки заявки | BroSky</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }

        /* Форма */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #FF69B4;
        }

        .photo-upload {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-upload:hover {
            border-color: #FF69B4;
            background: #fff0f5;
        }

        .photo-preview {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .photo-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #FF69B4;
        }

        button {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        button:hover {
            background: #e85da0;
            transform: translateY(-2px);
        }

        /* Панель логов */
        .log-panel {
            background: #1e1e2e;
            border-radius: 16px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-title {
            color: #fff;
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .log-content {
            background: #0d0d1a;
            border-radius: 12px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            border-left: 3px solid;
        }

        .log-info {
            background: #1a1a2e;
            color: #aaa;
            border-left-color: #3a86ff;
        }

        .log-success {
            background: #1a3a2a;
            color: #4ade80;
            border-left-color: #4ade80;
        }

        .log-error {
            background: #3a1a1a;
            color: #f87171;
            border-left-color: #f87171;
        }

        .log-warning {
            background: #3a3a1a;
            color: #fbbf24;
            border-left-color: #fbbf24;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            margin-top: 12px;
        }

        .clear-btn:hover {
            background: #333;
            transform: none;
        }

        /* Статус бары */
        .status-bars {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-item {
            flex: 1;
            background: #f0f0f0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .status-item .label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }

        .status-item .value {
            font-size: 18px;
            font-weight: bold;
        }

        .status-item.pass .value { color: #22c55e; }
        .status-item.fail .value { color: #ef4444; }
        .status-item.warning .value { color: #f59e0b; }

        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔧 Визуальный тест отправки заявки</h1>
            <p class="subtitle">Каждый шаг отображается в реальном времени — смотри что происходит</p>

            <div class="status-bars" id="statusBars">
                <div class="status-item">
                    <div class="label">🔗 Supabase URL</div>
                    <div class="value" id="statusUrl">⏳</div>
                </div>
                <div class="status-item">
                    <div class="label">🔑 API Key</div>
                    <div class="value" id="statusKey">⏳</div>
                </div>
                <div class="status-item">
                    <div class="label">📁 Таблица</div>
                    <div class="value" id="statusTable">⏳</div>
                </div>
                <div class="status-item">
                    <div class="label">👤 Авторизация</div>
                    <div class="value" id="statusAuth">⏳</div>
                </div>
            </div>

            <form id="testForm">
                <div class="form-group">
                    <label>📝 Название объявления</label>
                    <input type="text" id="title" value="Тестовое объявление" required>
                </div>
                <div class="form-group">
                    <label>📍 Город</label>
                    <select id="city">
                        <option value="Москва">Москва</option>
                        <option value="СПб">Санкт-Петербург</option>
                        <option value="Сочи">Сочи</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>💰 Цена за сутки (₽)</label>
                    <input type="number" id="price" value="5000" required>
                </div>
                <div class="form-group">
                    <label>📄 Описание</label>
                    <textarea id="description" rows="3">Тестовое описание жилья. Очень уютно и комфортно!</textarea>
                </div>
                <div class="form-group">
                    <label>🖼️ Фотография жилья</label>
                    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
                        📸 Нажмите, чтобы выбрать фото
                    </div>
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <div class="photo-preview" id="photoPreview"></div>
                </div>
                <button type="submit" id="submitBtn">🚀 Отправить заявку</button>
            </form>
        </div>

        <div class="card">
            <div class="log-title">
                <span>📋</span> Лог проверок (в реальном времени)
                <button class="clear-btn" onclick="clearLog()">Очистить</button>
            </div>
            <div class="log-content" id="logContent">
                <div class="log-entry log-info">🟢 Готов к работе. Заполните форму и нажмите "Отправить заявку"</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ⬇️⬇️⬇️ ВСТАВЬ СВОИ ДАННЫЕ ИЗ SUPABASE ⬇️⬇️⬇️
        // ============================================================
        const SUPABASE_URL = 'https://bgyjgzzvoxyvpysywvlb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJneWpnenp2b3h5dnB5c3l3dmxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2Mzk3NjQsImV4cCI6MjA5NjIxNTc2NH0.Yz91MvAXo45Z3hq-76V5yBD4aB_2dFgpjXDBDWG9FHM';
        // ============================================================
        
        let logs = [];

        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('logContent');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `[${time}] ${message}`;
            logDiv.appendChild(entry);
            entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            logs.push({ time, message, type });
        }

        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
            addLog('Лог очищен', 'info');
        }

        function updateStatus(id, status, text) {
            const el = document.getElementById(id);
            if (el) {
                el.innerText = text;
                el.parentElement.className = `status-item ${status}`;
            }
        }

        // Проверка настроек при загрузке
        async function checkSettings() {
            addLog('🔍 Начинаю проверку настроек...', 'info');
            
            // Проверка URL
            if (SUPABASE_URL && SUPABASE_URL !== 'https://ТВОЙ_ПРОЕКТ.supabase.co') {
                updateStatus('statusUrl', 'pass', '✅');
                addLog(`✅ SUPABASE_URL: ${SUPABASE_URL}`, 'success');
            } else {
                updateStatus('statusUrl', 'fail', '❌');
                addLog(`❌ SUPABASE_URL не настроен! Текущее значение: "${SUPABASE_URL}"`, 'error');
                addLog(`   Нужно заменить на свой URL из Supabase (Settings → API)`, 'warning');
                return false;
            }
            
            // Проверка KEY
            if (SUPABASE_KEY && SUPABASE_KEY !== 'ТВОЙ_ANON_KEY' && SUPABASE_KEY.length > 50) {
                updateStatus('statusKey', 'pass', '✅');
                addLog(`✅ SUPABASE_KEY найден (${SUPABASE_KEY.substring(0, 30)}...)`, 'success');
            } else {
                updateStatus('statusKey', 'fail', '❌');
                addLog(`❌ SUPABASE_KEY не настроен!`, 'error');
                return false;
            }
            
            // Проверка таблицы
            addLog(`🔍 Проверяю таблицу pending_listings...`, 'info');
            try {
                const testResponse = await fetch(`${SUPABASE_URL}/rest/v1/pending_listings?limit=1`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (testResponse.ok) {
                    updateStatus('statusTable', 'pass', '✅');
                    addLog(`✅ Таблица pending_listings существует и доступна`, 'success');
                } else if (testResponse.status === 404) {
                    updateStatus('statusTable', 'fail', '❌');
                    addLog(`❌ Таблица pending_listings не найдена! (404)`, 'error');
                    addLog(`   Нужно создать таблицу в Supabase SQL Editor`, 'warning');
                    return false;
                } else {
                    updateStatus('statusTable', 'warning', '⚠️');
                    addLog(`⚠️ Таблица pending_listings: статус ${testResponse.status}`, 'warning');
                }
            } catch (err) {
                updateStatus('statusTable', 'fail', '❌');
                addLog(`❌ Не удалось подключиться к Supabase: ${err.message}`, 'error');
                return false;
            }
            
            // Проверка авторизации
            const user = localStorage.getItem('brosky_current_user');
            if (user) {
                const userData = JSON.parse(user);
                updateStatus('statusAuth', 'pass', '✅');
                addLog(`✅ Пользователь авторизован: ${userData.name} (${userData.email})`, 'success');
            } else {
                updateStatus('statusAuth', 'warning', '⚠️');
                addLog(`⚠️ Пользователь не авторизован. Создаю тестового...`, 'warning');
                const testUser = {
                    id: Date.now(),
                    name: 'Тестовый Пользователь',
                    email: 'test@test.com'
                };
                localStorage.setItem('brosky_current_user', JSON.stringify(testUser));
                addLog(`✅ Создан тестовый пользователь: ${testUser.name}`, 'success');
                updateStatus('statusAuth', 'pass', '✅');
            }
            
            addLog(`🎉 Все настройки проверены! Можете отправлять заявку.`, 'success');
            return true;
        }

        // Предпросмотр фото
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const preview = document.getElementById('photoPreview');
            preview.innerHTML = '';
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                addLog(`📸 Выбран файл: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`, 'info');
                
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    preview.appendChild(img);
                    addLog(`✅ Фото загружено в предпросмотр`, 'success');
                };
                reader.readAsDataURL(file);
            }
        });

        // Отправка формы
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            addLog('🚀 === НАЧАЛО ОТПРАВКИ ЗАЯВКИ ===', 'info');
            
            // Получаем данные
            const title = document.getElementById('title').value;
            const city = document.getElementById('city').value;
            const price = parseInt(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const photoFile = document.getElementById('photoInput').files[0];
            
            addLog(`📝 Данные формы:`, 'info');
            addLog(`   - Название: "${title}"`, 'info');
            addLog(`   - Город: ${city}`, 'info');
            addLog(`   - Цена: ${price} ₽`, 'info');
            
            // Проверка фото
            if (!photoFile) {
                addLog(`❌ ОШИБКА: Не выбрано фото!`, 'error');
                return;
            }
            
            addLog(`📸 Фото: ${photoFile.name} (${(photoFile.size / 1024).toFixed(2)} KB)`, 'info');
            
            // Получаем пользователя
            const user = JSON.parse(localStorage.getItem('brosky_current_user') || '{}');
            addLog(`👤 Пользователь: ${user.name || 'unknown'} (${user.email || 'no email'})`, 'info');
            
            // Конвертируем фото
            addLog(`🔄 Конвертируем фото в Base64...`, 'info');
            
            const reader = new FileReader();
            reader.onload = async function(ev) {
                const photoData = ev.target.result;
                addLog(`✅ Фото сконвертировано (${(photoData.length / 1024).toFixed(2)} KB)`, 'success');
                
                const newListing = {
                    id: Date.now(),
                    title: title,
                    city: city,
                    type: 'apartment',
                    address: 'Тестовый адрес',
                    price: price,
                    beds: 1,
                    baths: 1,
                    guests: 2,
                    description: description,
                    amenities: ['Wi-Fi', 'Кухня'],
                    image: photoData,
                    status: 'pending',
                    created_at: new Date().toISOString(),
                    userId: user.id || Date.now(),
                    userName: user.name || 'Тестер',
                    userEmail: user.email || 'test@test.com'
                };
                
                addLog(`📦 Подготовлены данные для отправки:`, 'info');
                addLog(`   - ID: ${newListing.id}`, 'info');
                addLog(`   - Статус: ${newListing.status}`, 'info');
                
                addLog(`🌐 Отправка запроса в Supabase...`, 'info');
                addLog(`   URL: ${SUPABASE_URL}/rest/v1/pending_listings`, 'info');
                
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/pending_listings`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(newListing)
                    });
                    
                    addLog(`📡 Ответ сервера: статус ${response.status} ${response.statusText}`, 'info');
                    
                    if (response.ok) {
                        addLog(`✅✅✅ УСПЕХ! Заявка успешно отправлена! ✅✅✅`, 'success');
                        addLog(`🎉 Проверьте админ-панель (admin-bookings.html) для подтверждения`, 'success');
                        
                        // Очищаем форму
                        document.getElementById('testForm').reset();
                        document.getElementById('photoPreview').innerHTML = '';
                        document.getElementById('title').value = 'Тестовое объявление';
                        document.getElementById('price').value = '5000';
                        
                        addLog(`🧹 Форма очищена`, 'info');
                    } else {
                        const errorText = await response.text();
                        addLog(`❌ ОШИБКА ${response.status}: ${errorText}`, 'error');
                        
                        if (response.status === 401) {
                            addLog(`🔑 Проблема с API ключом. Проверьте SUPABASE_KEY`, 'warning');
                        } else if (response.status === 404) {
                            addLog(`📁 Таблица 'pending_listings' не найдена. Создайте её в Supabase`, 'warning');
                        } else if (response.status === 400) {
                            addLog(`📝 Неверный формат данных. Проверьте структуру таблицы`, 'warning');
                        }
                    }
                } catch (error) {
                    addLog(`❌❌❌ СЕТЕВАЯ ОШИБКА: ${error.message} ❌❌❌`, 'error');
                    addLog(`💡 Возможные причины:`, 'warning');
                    addLog(`   1. Неправильный URL Supabase`, 'warning');
                    addLog(`   2. Нет интернет-соединения`, 'warning');
                    addLog(`   3. Блокировка CORS (нужен Live Server)`, 'warning');
                }
            };
            
            reader.readAsDataURL(photoFile);
        });
        
        // Запускаем проверку при загрузке
        checkSettings();
    </script>
</body>
</html>
