<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | BroSky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #f0f6ff 0%, #e9f0fa 100%); min-height: 100vh; }

        :root {
            --primary-blue: #2c7da0;
            --pure-white: #ffffff;
            --cool-gray: #5a6e7c;
            --charcoal: #2c3e44;
            --shadow-sm: 0 12px 28px rgba(0, 32, 64, 0.08);
            --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 0 20px; }

        header { padding: 24px 0; text-align: center; }
        .logo { display: inline-flex; align-items: center; gap: 10px; font-size: 1.8rem; font-weight: 700; color: var(--charcoal); text-decoration: none; }
        .logo i { color: var(--primary-blue); font-size: 2rem; }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: var(--shadow-sm);
            margin: 20px 0 60px;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 2px solid #eef2f7;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--cool-gray);
            transition: var(--transition);
            position: relative;
        }

        .tab:hover { color: var(--primary-blue); }
        .tab.active { color: var(--primary-blue); }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary-blue);
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--charcoal); }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d0dee9;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }
        input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(44, 125, 160, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 48px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
        }
        .btn-login:hover { background: #236e8a; transform: translateY(-2px); }

        .error-message {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
            text-align: center;
            background: #fdeaea;
            padding: 10px;
            border-radius: 12px;
        }
        .success-message {
            color: #27ae60;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            background: #e8f8f0;
            border-radius: 12px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--cool-gray);
            font-size: 0.85rem;
            border-top: 1px solid rgba(44, 125, 160, 0.1);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 560px) { .login-card { padding: 32px 24px; } }
    </style>
</head>
<body>

<header>
    <div class="container">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="BroSky" style="height: 50px; width: auto;">
            <span>BroSky</span>
        </a>
    </div>
</header>

<main>
    <div class="container">
        <div class="login-card">
            <div class="tabs">
                <div class="tab active" data-tab="login">Вход</div>
                <div class="tab" data-tab="register">Регистрация</div>
            </div>

            <div class="form-panel active" id="loginPanel">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required placeholder="example@mail.com">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                    <div id="loginError" class="error-message"></div>
                    <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Войти</button>
                </form>
            </div>

            <div class="form-panel" id="registerPanel">
                <form id="registerForm">
                    <div class="form-group">
                        <label>Имя и фамилия</label>
                        <input type="text" id="regName" required placeholder="Иван Иванов">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" required placeholder="ivan@example.com">
                    </div>
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="tel" id="regPhone" placeholder="+7 (999) 123-45-67">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="regPassword" required placeholder="минимум 6 символов">
                    </div>
                    <div class="form-group">
                        <label>Подтверждение пароля</label>
                        <input type="password" id="regPasswordConfirm" required placeholder="повторите пароль">
                    </div>
                    <div id="registerError" class="error-message"></div>
                    <div id="registerSuccess" class="success-message"></div>
                    <button type="submit" class="btn-login" id="registerBtn"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p><i class="fas fa-dove"></i> BroSky — аренда без хлопот. © 2026</p>
    </div>
</footer>

<script>
    // Ключи для хранения
    const STORAGE_KEYS = {
        USERS: 'brosky_users',
        CURRENT_USER: 'brosky_current_user'
    };

    function getUsers() {
        const users = localStorage.getItem(STORAGE_KEYS.USERS);
        return users ? JSON.parse(users) : [];
    }

    function saveUsers(users) {
        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
    }

    function getCurrentUser() {
        const user = localStorage.getItem(STORAGE_KEYS.CURRENT_USER);
        return user ? JSON.parse(user) : null;
    }

    function setCurrentUser(user) {
        if (user) {
            localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(user));
        } else {
            localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
        }
    }

    function isEmailUnique(email) {
        const users = getUsers();
        return !users.some(user => user.email.toLowerCase() === email.toLowerCase());
    }

    function findUserByEmail(email) {
        const users = getUsers();
        return users.find(user => user.email.toLowerCase() === email.toLowerCase());
    }

    function hashPassword(password) {
        return btoa(password + 'brosky_salt');
    }

    function verifyPassword(password, hash) {
        return hashPassword(password) === hash;
    }

    function isValidEmail(email) {
        const re = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
        return re.test(email);
    }

    // Переключение вкладок
    const tabs = document.querySelectorAll('.tab');
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            if (tab.dataset.tab === 'login') {
                loginPanel.classList.add('active');
                registerPanel.classList.remove('active');
                document.getElementById('loginError').style.display = 'none';
            } else {
                registerPanel.classList.add('active');
                loginPanel.classList.remove('active');
                document.getElementById('registerError').style.display = 'none';
                document.getElementById('registerSuccess').style.display = 'none';
            }
        });
    });

    function setButtonLoading(button, isLoading) {
        if (isLoading) {
            button.dataset.originalText = button.innerHTML;
            button.innerHTML = '<span class="loader"></span> Загрузка...';
            button.disabled = true;
        } else {
            button.innerHTML = button.dataset.originalText;
            button.disabled = false;
        }
    }

    // РЕГИСТРАЦИЯ
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regPasswordConfirm').value;

        const errorDiv = document.getElementById('registerError');
        const successDiv = document.getElementById('registerSuccess');
        const registerBtn = document.getElementById('registerBtn');

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        if (name.length < 2) {
            errorDiv.textContent = 'Введите корректное имя (минимум 2 символа)';
            errorDiv.style.display = 'block';
            return;
        }

        if (!isValidEmail(email)) {
            errorDiv.textContent = 'Введите корректный email';
            errorDiv.style.display = 'block';
            return;
        }

        if (!isEmailUnique(email)) {
            errorDiv.textContent = 'Пользователь с таким email уже существует';
            errorDiv.style.display = 'block';
            return;
        }

        if (password.length < 6) {
            errorDiv.textContent = 'Пароль должен содержать минимум 6 символов';
            errorDiv.style.display = 'block';
            return;
        }

        if (password !== confirm) {
            errorDiv.textContent = 'Пароли не совпадают';
            errorDiv.style.display = 'block';
            return;
        }

        setButtonLoading(registerBtn, true);

        const newUser = {
            id: Date.now(),
            name: name,
            email: email,
            phone: phone,
            passwordHash: hashPassword(password),
            createdAt: new Date().toISOString()
        };

        const users = getUsers();
        users.push(newUser);
        saveUsers(users);

        setCurrentUser({
            id: newUser.id,
            name: newUser.name,
            email: newUser.email,
            phone: newUser.phone
        });

        setButtonLoading(registerBtn, false);

        successDiv.textContent = 'Регистрация успешна! Перенаправление на главную...';
        successDiv.style.display = 'block';

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);
    });

    // ВХОД
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        errorDiv.style.display = 'none';

        if (!email || !password) {
            errorDiv.textContent = 'Введите email и пароль';
            errorDiv.style.display = 'block';
            return;
        }

        setButtonLoading(loginBtn, true);

        const user = findUserByEmail(email);

        if (!user || !verifyPassword(password, user.passwordHash)) {
            setButtonLoading(loginBtn, false);
            errorDiv.textContent = 'Неверный email или пароль';
            errorDiv.style.display = 'block';
            return;
        }

        setCurrentUser({
            id: user.id,
            name: user.name,
            email: user.email,
            phone: user.phone
        });

        setButtonLoading(loginBtn, false);

        alert(`Добро пожаловать, ${user.name}!`);
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
