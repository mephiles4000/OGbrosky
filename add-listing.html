<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить жильё | BroSky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Карточка формы */
        .form-card {
            background: white;
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .form-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e44;
            margin-bottom: 8px;
        }

        .form-card .subtitle {
            color: #5a6e7c;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        /* Форма */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e44;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d0dee9;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #FF69B4;
            box-shadow: 0 0 0 3px rgba(255,105,180,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Загрузка фото */
        .photo-upload {
            border: 2px dashed #d0dee9;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-upload:hover {
            border-color: #FF69B4;
            background: #fff0f5;
        }

        .photo-upload i {
            font-size: 2rem;
            color: #FF69B4;
            margin-bottom: 8px;
        }

        .photo-preview {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .photo-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #FF69B4;
        }

        /* Кнопка отправки */
        .btn-submit {
            width: 100%;
            background: #FF69B4;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 48px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .btn-submit:hover {
            background: #e85da0;
            transform: translateY(-2px);
        }

        /* Уведомления (toast) */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e44;
            color: white;
            padding: 12px 24px;
            border-radius: 48px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Шапка */
        header {
            margin-bottom: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255,255,255,0.95);
            padding: 16px 32px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e44;
            text-decoration: none;
        }

        .logo i {
            color: #FF69B4;
            font-size: 1.8rem;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: 500;
            color: #5a6e7c;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            color: #FF69B4;
        }

        .btn-outline-light {
            border: 1.5px solid #FF69B4;
            background: transparent;
            padding: 6px 16px;
            border-radius: 40px;
            color: #FF69B4;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .form-card { padding: 24px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .navbar { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fas fa-cloud"></i>
                <span>BroSky</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Жильё</a>
                <a href="favorites.html">Избранное</a>
                <a href="my-bookings.html">Мои брони</a>
                <a href="contact.html">Контакты</a>
                <div id="userMenu"></div>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="form-card">
            <h1><i class="fas fa-plus-circle" style="color: #FF69B4;"></i> Стать хозяином</h1>
            <p class="subtitle">Заполните форму, чтобы добавить своё жильё в каталог BroSky</p>

            <form id="addListingForm">
                <div class="form-group">
                    <label>Название объявления *</label>
                    <input type="text" id="title" placeholder="Например: Уютная студия в центре" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Город *</label>
                        <select id="city" required>
                            <option value="Москва">Москва</option>
                            <option value="СПб">Санкт-Петербург</option>
                            <option value="Сочи">Сочи</option>
                            <option value="Казань">Казань</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Тип жилья *</label>
                        <select id="type" required>
                            <option value="apartment">Квартира</option>
                            <option value="house">Дом</option>
                            <option value="loft">Loft</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Адрес *</label>
                    <input type="text" id="address" placeholder="Улица, дом, район" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Цена за сутки (₽) *</label>
                        <input type="number" id="price" placeholder="3500" required>
                    </div>
                    <div class="form-group">
                        <label>Количество спален</label>
                        <select id="beds">
                            <option value="1">1 спальня</option>
                            <option value="2">2 спальни</option>
                            <option value="3">3 спальни</option>
                            <option value="4">4+ спальни</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Количество ванных</label>
                        <select id="baths">
                            <option value="1">1 ванная</option>
                            <option value="2">2 ванные</option>
                            <option value="3">3+ ванные</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Максимум гостей</label>
                        <select id="guests">
                            <option value="2">2 гостя</option>
                            <option value="4">4 гостя</option>
                            <option value="6">6 гостей</option>
                            <option value="8">8+ гостей</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Описание *</label>
                    <textarea id="description" rows="4" placeholder="Расскажите о преимуществах вашего жилья..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Удобства (через запятую)</label>
                    <input type="text" id="amenities" placeholder="Wi-Fi, Кухня, Телевизор, Кондиционер">
                </div>

                <div class="form-group">
                    <label>Фотография жилья *</label>
                    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
                        <i class="fas fa-camera"></i>
                        <p>Нажмите, чтобы выбрать фото</p>
                        <p style="font-size: 12px; color: #999;">Рекомендуемый размер: 800x500px</p>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <div class="photo-preview" id="photoPreview"></div>
                    <input type="hidden" id="photoData" value="">
                </div>

                <button type="submit" class="btn-submit">Отправить заявку</button>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p><i class="fas fa-dove"></i> BroSky — аренда без хлопот. © 2025</p>
    </div>
</footer>

<script>
    // ================================================
    // ВСТАВЬТЕ ВАШИ ДАННЫЕ ИЗ SUPABASE
    // ================================================
    const SUPABASE_URL = 'https://bgyjgzzvoxyvpysywvlb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJneWpnenp2b3h5dnB5c3l3dmxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2Mzk3NjQsImV4cCI6MjA5NjIxNTc2NH0.Yz91MvAXo45Z3hq-76V5yBD4aB_2dFgpjXDBDWG9FHM';   // замените на свой anon public key
    // ================================================

    // Получение текущего пользователя (из localStorage)
    function getCurrentUser() {
        let user = localStorage.getItem('brosky_current_user');
        if (!user) {
            // Создаём тестового пользователя для удобства
            user = { id: Date.now(), name: 'Гость', email: 'guest@example.com' };
            localStorage.setItem('brosky_current_user', JSON.stringify(user));
        }
        return JSON.parse(user);
    }

    // Показать всплывающее уведомление
    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#e74c3c' : '#2c3e44';
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Предпросмотр фото
    document.getElementById('photoInput').addEventListener('change', function(e) {
        const preview = document.getElementById('photoPreview');
        preview.innerHTML = '';
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = document.createElement('img');
                img.src = ev.target.result;
                preview.appendChild(img);
                document.getElementById('photoData').value = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // Отправка формы
    document.getElementById('addListingForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const currentUser = getCurrentUser();
        const title = document.getElementById('title').value.trim();
        const city = document.getElementById('city').value;
        const type = document.getElementById('type').value;
        const address = document.getElementById('address').value.trim();
        const price = parseInt(document.getElementById('price').value);
        const beds = parseInt(document.getElementById('beds').value);
        const baths = parseInt(document.getElementById('baths').value);
        const guests = parseInt(document.getElementById('guests').value);
        const description = document.getElementById('description').value.trim();
        const amenitiesRaw = document.getElementById('amenities').value;
        const amenities = amenitiesRaw.split(',').map(a => a.trim()).filter(a => a);
        const photoData = document.getElementById('photoData').value;

        // Валидация
        if (!title || !city || !address || !price || !description) {
            showToast('Заполните все обязательные поля', true);
            return;
        }
        if (!photoData) {
            showToast('Добавьте фотографию жилья', true);
            return;
        }

        const newListing = {
            id: Date.now(),
            title, city, type, address, price, beds, baths, guests,
            description,
            amenities: amenities.length ? amenities : ['Wi-Fi', 'Кухня', 'Телевизор'],
            image: photoData,
            status: 'pending',
            created_at: new Date().toISOString(),
            userId: currentUser.id,
            userName: currentUser.name,
            userEmail: currentUser.email
        };

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/pending_listings`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newListing)
            });

            if (response.ok) {
                showToast('Заявка отправлена! Администратор рассмотрит её в ближайшее время.');
                document.getElementById('addListingForm').reset();
                document.getElementById('photoPreview').innerHTML = '';
                document.getElementById('photoData').value = '';
            } else {
                const error = await response.text();
                console.error(error);
                showToast(`Ошибка ${response.status}. Попробуйте позже.`, true);
            }
        } catch (err) {
            console.error(err);
            showToast('Ошибка соединения. Проверьте интернет.', true);
        }
    });

    // Отображение имени пользователя в шапке
    function updateUserMenu() {
        const userMenu = document.getElementById('userMenu');
        const user = getCurrentUser();
        if (userMenu) {
            userMenu.innerHTML = `<button class="btn-outline-light"><i class="fas fa-user-circle"></i> ${user.name}</button>`;
        }
    }
    updateUserMenu();
</script>
</body>
</html>
