<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить объявление | BroSky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f0f6ff 0%, #e9f0fa 100%);
        }

        :root {
            --primary-blue: #2c7da0;
            --pure-white: #ffffff;
            --cool-gray: #5a6e7c;
            --charcoal: #2c3e44;
            --shadow-sm: 0 12px 28px rgba(0, 32, 64, 0.08);
            --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 24px 0;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(8px);
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--charcoal);
            text-decoration: none;
        }

        .form-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--charcoal);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d0dee9;
            border-radius: 16px;
            font-family: inherit;
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .btn-submit {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid rgba(44, 125, 160, 0.2);
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="BroSky" style="height: 60px; width: auto;">
            <span>BroSky</span>
        </a>
    </div>
</header>

<main>
    <div class="container">
        <div class="form-card">
            <h1 style="margin-bottom: 30px;">➕ Разместить объявление</h1>
            <form id="addListingForm">
                <div class="form-group">
                    <label>Название объявления</label>
                    <input type="text" id="title" required placeholder="Например: Уютная студия в центре">
                </div>
                <div class="form-group">
                    <label>Город</label>
                    <select id="city" required>
                        <option value="">Выберите город</option>
                        <option>Москва</option>
                        <option>Санкт-Петербург</option>
                        <option>Сочи</option>
                        <option>Казань</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Адрес</label>
                    <input type="text" id="address" required placeholder="Улица, дом">
                </div>
                <div class="form-group">
                    <label>Тип жилья</label>
                    <select id="type" required>
                        <option value="apartment">Квартира</option>
                        <option value="house">Дом</option>
                        <option value="loft">Loft</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Цена за сутки (₽)</label>
                    <input type="number" id="price" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea rows="4" id="description" placeholder="Расскажите о преимуществах..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Опубликовать объявление</button>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p><i class="fas fa-dove"></i> BroSky — аренда без хлопот. © 2025</p>
    </div>
</footer>

<script>
    document.getElementById('addListingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const city = document.getElementById('city').value;
        const address = document.getElementById('address').value;
        const price = document.getElementById('price').value;

        alert(`✅ Объявление "${title}" успешно создано!\nМы свяжемся с вами для подтверждения.`);
        this.reset();
    });
</script>
</body>
</html>
