<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | BroSky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #f0f6ff 0%, #e9f0fa 100%); }

        :root {
            --primary-blue: #2c7da0;
            --accent-pink: #FF69B4;
            --accent-purple: #9B59B6;
            --accent-coral: #FF6B6B;
            --soft-blue: #d4e6f1;
            --light-slate: #eef2f7;
            --pure-white: #ffffff;
            --cool-gray: #5a6e7c;
            --charcoal: #2c3e44;
            --shadow-sm: 0 12px 28px rgba(0, 32, 64, 0.08);
            --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

        header {
            padding: 24px 0 16px;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.72);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(44, 125, 160, 0.15);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--charcoal);
            text-decoration: none;
        }

        .logo i { color: var(--accent-pink); font-size: 2rem; }

        .btn-outline-light {
            border: 1.5px solid var(--accent-pink);
            background: transparent;
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--accent-pink);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline-light:hover { background: var(--accent-pink); color: white; }

        .admin-tabs { display: flex; gap: 16px; margin: 30px 0 24px; border-bottom: 2px solid #eef2f7; flex-wrap: wrap; }
        .admin-tab { padding: 12px 24px; cursor: pointer; font-weight: 600; color: var(--cool-gray); transition: var(--transition); border-bottom: 2px solid transparent; }
        .admin-tab:hover { color: var(--primary-blue); }
        .admin-tab.active { color: var(--accent-pink); border-bottom-color: var(--accent-pink); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats { display: flex; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
        .stat-card { background: white; border-radius: 24px; padding: 20px 28px; box-shadow: var(--shadow-sm); flex: 1; min-width: 150px; transition: var(--transition); }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        .stat-number { font-size: 2rem; font-weight: 800; color: var(--accent-pink); }
        .stat-label { color: var(--cool-gray); font-size: 0.85rem; margin-top: 4px; }

        .table-wrapper { background: white; border-radius: 24px; overflow-x: auto; box-shadow: var(--shadow-sm); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #eef2f7; }
        th { background: #f8fafc; font-weight: 600; color: var(--charcoal); font-size: 0.9rem; }
        td { font-size: 0.85rem; }

        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }

        .btn-approve { background: var(--accent-pink); color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; margin-right: 6px; font-weight: 500; transition: var(--transition); }
        .btn-approve:hover { background: #e85da0; transform: translateY(-1px); }
        .btn-reject { background: var(--accent-coral); color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 500; transition: var(--transition); }
        .btn-reject:hover { background: #e55a5a; transform: translateY(-1px); }

        .listing-image-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: var(--transition); }
        .listing-image-preview:hover { transform: scale(1.05); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--cool-gray); }
        .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }

        footer { text-align: center; padding: 30px 0; margin-top: 40px; color: var(--cool-gray); border-top: 1px solid rgba(44, 125, 160, 0.2); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 2000; justify-content: center; align-items: center; cursor: pointer; }
        .modal.active { display: flex; }
        .modal-content { max-width: 90%; max-height: 90%; }
        .modal-content img { width: 100%; height: auto; border-radius: 16px; }
        .modal-close { position: absolute; top: 20px; right: 30px; font-size: 2rem; color: white; cursor: pointer; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--charcoal);
            color: white;
            padding: 12px 24px;
            border-radius: 48px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            th, td { padding: 10px; font-size: 0.75rem; }
            .stat-card { padding: 12px 16px; }
            .stat-number { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <a href="index.html" class="logo"><i class="fas fa-cloud"></i><span>BroSky Admin</span></a>
            <div><a href="index.html" class="btn-outline-light"><i class="fas fa-home"></i> На сайт</a></div>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <h1 style="margin: 30px 0 20px; font-size: 1.8rem;"><i class="fas fa-chart-line"></i> Панель управления</h1>

        <div class="admin-tabs">
            <div class="admin-tab active" data-tab="bookings">📋 Бронирования</div>
            <div class="admin-tab" data-tab="listings">🏠 Заявки на жильё</div>
        </div>

        <div id="bookingsTab" class="tab-content active">
            <div class="stats" id="bookingsStats"></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Пользователь</th><th>Объявление</th><th>Даты</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="bookingsTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="listingsTab" class="tab-content">
            <div class="stats" id="listingsStats"></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>От кого</th><th>Название</th><th>Город</th><th>Цена</th><th>Фото</th><th>Статус</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="listingsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer><div class="container"><p><i class="fas fa-dove"></i> BroSky — Административная панель</p></div></footer>

<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modalImage" src="" alt="">
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ SUPABASE ==========
    // ⬇️⬇️⬇️ ЗАМЕНИ НА СВОИ ДАННЫЕ ИЗ SUPABASE ⬇️⬇️⬇️
    const SUPABASE_URL = 'https://bgyjgzzvoxyvpysywvlb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJneWpnenp2b3h5dnB5c3l3dmxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2Mzk3NjQsImV4cCI6MjA5NjIxNTc2NH0.Yz91MvAXo45Z3hq-76V5yBD4aB_2dFgpjXDBDWG9FHM';
    const ADMIN_EMAIL = 'admin@brosky.ru';

    // ========== ФУНКЦИИ SUPABASE ==========
    async function supabaseRequest(table, method = 'GET', data = null, id = null) {
        let url = `${SUPABASE_URL}/rest/v1/${table}`;
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };
        let options = { method, headers };
        if (method === 'GET') { if (id) url += `?id=eq.${id}`; }
        else if (method === 'POST') { options.body = JSON.stringify(data); }
        else if (method === 'PATCH') { url += `?id=eq.${id}`; options.body = JSON.stringify(data); }
        else if (method === 'DELETE') { url += `?id=eq.${id}`; }
        try {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`Ошибка ${response.status}`);
            if (method === 'GET') return await response.json();
            return { success: true };
        } catch (error) { console.error(error); return null; }
    }

    async function getBookings() {
        const result = await supabaseRequest('bookings', 'GET');
        return result || [];
    }
    async function getUsers() {
        const result = await supabaseRequest('users', 'GET');
        return result || [];
    }
    async function getPendingListings() {
        const result = await supabaseRequest('pending_listings', 'GET');
        return result || [];
    }
    async function addMainListing(listing) {
        return await supabaseRequest('listings', 'POST', listing);
    }
    async function deletePendingListing(id) {
        return await supabaseRequest('pending_listings', 'DELETE', null, id);
    }
    async function updateBookingStatus(id, status) {
        return await supabaseRequest('bookings', 'PATCH', { status }, id);
    }
    async function deleteBooking(id) {
        return await supabaseRequest('bookings', 'DELETE', null, id);
    }

    // ========== ПОЛЬЗОВАТЕЛЬ ==========
    function getCurrentUser() {
        try {
            const user = localStorage.getItem('brosky_current_user');
            return user ? JSON.parse(user) : null;
        } catch(e) { return null; }
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    // ========== ПРОВЕРКА ДОСТУПА ==========
    function checkAdminAccess() {
        const user = getCurrentUser();
        if (!user || user.email !== ADMIN_EMAIL) {
            alert('Доступ только для администратора!');
            window.location.href = 'login.html';
            return false;
        }
        return true;
    }

    // ========== БРОНИРОВАНИЯ ==========
    async function renderBookingsTab() {
        const bookings = await getBookings();
        const users = await getUsers();

        const total = bookings.length;
        const pending = bookings.filter(b => b.status === 'pending').length;
        const confirmed = bookings.filter(b => b.status === 'confirmed').length;
        const totalAmount = bookings.reduce((sum, b) => sum + (b.total_price || 0), 0);

        document.getElementById('bookingsStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Всего броней</div></div>
            <div class="stat-card"><div class="stat-number">${pending}</div><div class="stat-label">Ожидают</div></div>
            <div class="stat-card"><div class="stat-number">${confirmed}</div><div class="stat-label">Подтверждены</div></div>
            <div class="stat-card"><div class="stat-number">${totalAmount.toLocaleString()} ₽</div><div class="stat-label">Общая сумма</div></div>
        `;

        if (bookings.length === 0) {
            document.getElementById('bookingsTableBody').innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-calendar-alt"></i><br>Нет бронирований</td></tr>';
            return;
        }

        document.getElementById('bookingsTableBody').innerHTML = bookings.map(b => {
            const user = users.find(u => u.id === b.user_id);
            return `
                <tr>
                    <td>${b.id}</td>
                    <td>${user?.name || 'Неизвестный'}<br><small>${user?.email || ''}</small></td>
                    <td>${b.listing_id}</td>
                    <td>${formatDate(b.checkin)} - ${formatDate(b.checkout)}<br><small>${b.days || 1} ночей</small></td>
                    <td><strong>${(b.total_price || 0).toLocaleString()} ₽</strong></td>
                    <td><span class="status-badge status-${b.status}">${b.status === 'pending' ? 'Ожидает' : 'Подтверждено'}</span></td>
                    <td>
                        ${b.status === 'pending' ? `<button class="btn-approve" onclick="updateBookingStatus(${b.id}, 'confirmed')">✓ Подтвердить</button>` : ''}
                        <button class="btn-reject" onclick="deleteBookingHandler(${b.id})">🗑 Удалить</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function updateBookingStatusHandler(id, status) {
        const result = await updateBookingStatus(id, status);
        if (result?.success) {
            showToast('Статус обновлён');
            renderBookingsTab();
        } else {
            showToast('Ошибка обновления статуса');
        }
    }

    async function deleteBookingHandler(id) {
        if (confirm('Удалить бронирование?')) {
            const result = await deleteBooking(id);
            if (result?.success) {
                showToast('Бронирование удалено');
                renderBookingsTab();
            } else {
                showToast('Ошибка удаления');
            }
        }
    }

    // ========== ЗАЯВКИ НА ЖИЛЬЁ ==========
    async function renderListingsTab() {
        const pending = await getPendingListings();

        document.getElementById('listingsStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${pending.length}</div><div class="stat-label">Заявок на рассмотрении</div></div>
        `;

        if (pending.length === 0) {
            document.getElementById('listingsTableBody').innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-file-alt"></i><br>Нет заявок</td></tr>';
            return;
        }

        document.getElementById('listingsTableBody').innerHTML = pending.map(l => `
            <tr>
                <td>${l.id}</td>
                <td>${l.userName}<br><small>${l.userEmail}</small></td>
                <td>${l.title}</td>
                <td>${l.city}</td>
                <td><strong>${l.price.toLocaleString()} ₽</strong></td>
                <td><img src="${l.image}" class="listing-image-preview" onclick="viewImage('${l.image}')" onerror="this.src='https://placehold.co/50x50/2c7da0/white?text=No'"></td>
                <td><span class="status-badge status-pending">На модерации</span></td>
                <td>
                    <button class="btn-approve" onclick="approveListing(${l.id})">✅ Одобрить</button>
                    <button class="btn-reject" onclick="rejectListing(${l.id})">❌ Отклонить</button>
                </td>
            </tr>
        `).join('');
    }

    async function approveListing(id) {
        if (!confirm('Подтвердить добавление объявления?')) return;

        const pending = await getPendingListings();
        const listing = pending.find(l => l.id === id);

        if (listing) {
            const { id: _, userId, userName, userEmail, status, ...newListing } = listing;
            newListing.created_at = new Date().toISOString();

            const result = await addMainListing(newListing);
            if (result?.success) {
                await deletePendingListing(id);
                showToast('Объявление добавлено в каталог');
                renderListingsTab();
            } else {
                showToast('Ошибка при добавлении');
            }
        }
    }

    async function rejectListing(id) {
        if (!confirm('Отклонить заявку?')) return;

        const result = await deletePendingListing(id);
        if (result?.success) {
            showToast('Заявка отклонена');
            renderListingsTab();
        } else {
            showToast('Ошибка при отклонении');
        }
    }

    // ========== ПРОСМОТР ФОТО ==========
    function viewImage(src) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modalImg.src = src;
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('imageModal').classList.remove('active');
    }

    // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
    const tabs = document.querySelectorAll('.admin-tab');
    const bookingsTab = document.getElementById('bookingsTab');
    const listingsTab = document.getElementById('listingsTab');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            if (tab.dataset.tab === 'bookings') {
                bookingsTab.classList.add('active');
                listingsTab.classList.remove('active');
                renderBookingsTab();
            } else {
                bookingsTab.classList.remove('active');
                listingsTab.classList.add('active');
                renderListingsTab();
            }
        });
    });

    // Глобальные функции
    window.updateBookingStatus = updateBookingStatusHandler;
    window.deleteBookingHandler = deleteBookingHandler;
    window.approveListing = approveListing;
    window.rejectListing = rejectListing;
    window.viewImage = viewImage;
    window.closeModal = closeModal;

    // Инициализация
    if (checkAdminAccess()) {
        renderBookingsTab();
        renderListingsTab();
    }
</script>
</body>
</html>
