<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | BroSky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #f0f6ff 0%, #e9f0fa 100%); }

        :root {
            --primary-blue: #2c7da0;
            --pure-white: #ffffff;
            --cool-gray: #5a6e7c;
            --charcoal: #2c3e44;
            --shadow-sm: 0 12px 28px rgba(0, 32, 64, 0.08);
            --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

        header {
            padding: 24px 0 16px;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.72);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(44, 125, 160, 0.15);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--charcoal);
            text-decoration: none;
        }

        .logo i { color: var(--primary-blue); font-size: 2rem; }

        .btn-outline-light {
            border: 1.5px solid var(--primary-blue);
            background: transparent;
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--primary-blue);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline-light:hover {
            background: var(--primary-blue);
            color: white;
        }

        .admin-tabs {
            display: flex;
            gap: 16px;
            margin: 30px 0 24px;
            border-bottom: 2px solid #eef2f7;
        }

        .admin-tab {
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            color: var(--cool-gray);
            transition: var(--transition);
            border-bottom: 2px solid transparent;
        }

        .admin-tab:hover { color: var(--primary-blue); }
        .admin-tab.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 20px 28px;
            box-shadow: var(--shadow-sm);
            flex: 1;
            min-width: 150px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-blue);
        }

        .listings-table, .bookings-table {
            background: white;
            border-radius: 24px;
            overflow-x: auto;
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eef2f7;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--charcoal);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-approve {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 6px;
        }

        .btn-reject {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 6px;
        }

        .btn-view {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .listing-image-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            color: var(--cool-gray);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e44;
            color: white;
            padding: 12px 24px;
            border-radius: 48px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-content img {
            width: 100%;
            border-radius: 16px;
        }

        .modal-close {
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            th, td { padding: 8px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="BroSky" style="height: 50px; width: auto;">
                <span>BroSky</span>
            </a>
            <div>
                <a href="index.html" class="btn-outline-light">На сайт</a>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <h1 style="margin: 30px 0 20px; font-size: 1.8rem;"><i class="fas fa-chart-line"></i> Панель управления</h1>

        <div class="admin-tabs">
            <div class="admin-tab active" data-tab="bookings">Бронирования</div>
            <div class="admin-tab" data-tab="listings">Заявки на жильё</div>
        </div>

        <!-- Вкладка: Бронирования -->
        <div id="bookingsTab" class="tab-content active">
            <div class="stats" id="bookingsStats"></div>
            <div class="bookings-table">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Пользователь</th><th>Объявление</th><th>Даты</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="bookingsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Вкладка: Заявки на жильё -->
        <div id="listingsTab" class="tab-content">
            <div class="stats" id="listingsStats"></div>
            <div class="listings-table">
                <table>
                    <thead>
                        <tr><th>ID</th><th>От кого</th><th>Название</th><th>Город</th><th>Цена</th><th>Фото</th><th>Статус</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="listingsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer><div class="container"><p><i class="fas fa-dove"></i> BroSky — Административная панель</p></div></footer>

<!-- Модальное окно для просмотра фото -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="">
        <h3 id="modalTitle" style="margin-top: 16px;"></h3>
        <p id="modalDesc"></p>
    </div>
</div>

<script>
    const ADMIN_EMAIL = 'admin@brosky.ru';

    function getCurrentUser() {
        try {
            const user = localStorage.getItem('brosky_current_user');
            return user ? JSON.parse(user) : null;
        } catch(e) { return null; }
    }

    function checkAdminAccess() {
        const currentUser = getCurrentUser();
        if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
            alert('Доступ только для администратора! Войдите как admin@brosky.ru');
            window.location.href = 'login.html';
            return false;
        }
        return true;
    }

    // ========== БРОНИРОВАНИЯ ==========
    function getBookings() {
        const bookings = localStorage.getItem('brosky_bookings');
        return bookings ? JSON.parse(bookings) : [];
    }

    function saveBookings(bookings) {
        localStorage.setItem('brosky_bookings', JSON.stringify(bookings));
    }

    // ========== ЗАЯВКИ НА ЖИЛЬЁ ==========
    function getPendingListings() {
        const listings = localStorage.getItem('brosky_pending_listings');
        return listings ? JSON.parse(listings) : [];
    }

    function savePendingListings(listings) {
        localStorage.setItem('brosky_pending_listings', JSON.stringify(listings));
    }

    // ========== ОСНОВНЫЕ ОБЪЯВЛЕНИЯ (каталог) ==========
    function getMainListings() {
        const listings = localStorage.getItem('brosky_main_listings');
        if (listings) return JSON.parse(listings);

        // Дефолтные объявления, если ещё нет
        const defaultListings = [
            { id: 1, title: "Светлая студия в центре", city: "Москва", type: "apartment", address: "Москва, ул. Тверская", price: 4500, beds: 1, baths: 1, guests: 2, description: "Просторная светлая студия...", amenities: ["Wi-Fi", "Кухня"], image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500&h=300&fit=crop" },
            { id: 2, title: "Дизайнерский лофт", city: "СПб", type: "loft", address: "СПб, Невский пр.", price: 6800, beds: 2, baths: 1, guests: 4, description: "Стильный лофт...", amenities: ["Wi-Fi", "Кухня"], image: "https://images.unsplash.com/photo-1536376072261-38c75010e6c9?w=500&h=300&fit=crop" },
            { id: 3, title: "Коттедж с садом", city: "Сочи", type: "house", address: "Сочи, Адлерский р-н", price: 12000, beds: 3, baths: 2, guests: 6, description: "Уютный коттедж...", amenities: ["Wi-Fi", "Сауна"], image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=500&h=300&fit=crop" },
            { id: 4, title: "Уютная двушка", city: "Казань", type: "apartment", address: "Казань, ул. Баумана", price: 3200, beds: 2, baths: 1, guests: 4, description: "Уютная квартира...", amenities: ["Wi-Fi"], image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=500&h=300&fit=crop" },
            { id: 5, title: "Loft с панорамным видом", city: "Москва", type: "loft", address: "Москва, Москва-Сити", price: 9500, beds: 2, baths: 2, guests: 4, description: "Лофт с видом...", amenities: ["Wi-Fi", "Джакузи"], image: "https://images.unsplash.com/photo-1567767292278-a4f21aa2d36c?w=500&h=300&fit=crop" },
            { id: 6, title: "Дом у моря", city: "Сочи", type: "house", address: "Сочи, Лазаревское", price: 15000, beds: 4, baths: 2, guests: 8, description: "Вилла у моря...", amenities: ["Wi-Fi", "Камин"], image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=500&h=300&fit=crop" }
        ];
        localStorage.setItem('brosky_main_listings', JSON.stringify(defaultListings));
        return defaultListings;
    }

    function saveMainListings(listings) {
        localStorage.setItem('brosky_main_listings', JSON.stringify(listings));
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ========== ОДОБРЕНИЕ ЗАЯВКИ ==========
    function approveListing(listingId) {
        if (!confirm('Подтвердить добавление этого объявления в каталог?')) return;

        const pendingListings = getPendingListings();
        const listing = pendingListings.find(l => l.id === listingId);

        if (listing) {
            // Удаляем из заявок
            const updatedPending = pendingListings.filter(l => l.id !== listingId);
            savePendingListings(updatedPending);

            // Добавляем в основной каталог
            const mainListings = getMainListings();
            const newId = Math.max(...mainListings.map(l => l.id), 0) + 1;
            const newListing = {
                id: newId,
                title: listing.title,
                city: listing.city,
                type: listing.type,
                address: listing.address,
                price: listing.price,
                beds: listing.beds,
                baths: listing.baths,
                guests: listing.guests,
                description: listing.description,
                amenities: listing.amenities,
                image: listing.image
            };
            mainListings.push(newListing);
            saveMainListings(mainListings);

            showToast(`✅ Объявление "${listing.title}" добавлено в каталог!`);
        }

        renderListingsTab();
    }

    // ========== ОТКЛОНЕНИЕ ЗАЯВКИ ==========
    function rejectListing(listingId) {
        if (!confirm('Отклонить заявку? Пользователь получит уведомление.')) return;

        const pendingListings = getPendingListings();
        const updated = pendingListings.filter(l => l.id !== listingId);
        savePendingListings(updated);

        showToast('❌ Заявка отклонена');
        renderListingsTab();
    }

    // ========== УПРАВЛЕНИЕ БРОНИРОВАНИЯМИ ==========
    function updateBookingStatus(bookingId, newStatus) {
        let bookings = getBookings();
        bookings = bookings.map(b => b.id === bookingId ? { ...b, status: newStatus } : b);
        saveBookings(bookings);
        renderBookingsTab();
        showToast(`Статус брони #${bookingId} обновлён`);
    }

    function deleteBooking(bookingId) {
        if (!confirm('Удалить бронирование?')) return;
        let bookings = getBookings();
        bookings = bookings.filter(b => b.id !== bookingId);
        saveBookings(bookings);
        renderBookingsTab();
        showToast('Бронирование удалено');
    }

    function getUsers() {
        const users = localStorage.getItem('brosky_users');
        return users ? JSON.parse(users) : [];
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    // ========== ОТОБРАЖЕНИЕ ВКЛАДКИ С БРОНЯМИ ==========
    function renderBookingsTab() {
        const bookings = getBookings();
        const users = getUsers();

        const total = bookings.length;
        const totalAmount = bookings.reduce((sum, b) => sum + b.totalPrice, 0);
        const pending = bookings.filter(b => b.status === 'pending').length;

        document.getElementById('bookingsStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${total}</div><div>Всего броней</div></div>
            <div class="stat-card"><div class="stat-number">${pending}</div><div>Ожидают</div></div>
            <div class="stat-card"><div class="stat-number">${totalAmount.toLocaleString()} ₽</div><div>Общая сумма</div></div>
        `;

        const getUserName = (userId) => {
            const user = users.find(u => u.id === userId);
            return user ? user.name : 'Неизвестный';
        };

        if (bookings.length === 0) {
            document.getElementById('bookingsTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">Нет бронирований</td></tr>';
            return;
        }

        document.getElementById('bookingsTableBody').innerHTML = bookings.map(booking => `
            <tr>
                <td>${booking.id}</td>
                <td>${getUserName(booking.userId)}<br><small>${booking.userEmail || ''}</small></td>
                <td>${booking.listingTitle}</td>
                <td>${formatDate(booking.checkin)} - ${formatDate(booking.checkout)}<br><small>${booking.days} ночей</small></td>
                <td><strong>${booking.totalPrice.toLocaleString()} ₽</strong></td>
                <td><span class="status-badge status-${booking.status}">${booking.status === 'pending' ? 'Ожидает' : 'Подтверждено'}</span></td>
                <td>
                    ${booking.status === 'pending' ? `<button class="btn-approve" onclick="updateBookingStatus(${booking.id}, 'confirmed')">✓ Подтвердить</button>` : ''}
                    <button class="btn-reject" onclick="deleteBooking(${booking.id})">🗑 Удалить</button>
                </td>
            </tr>
        `).join('');
    }

    // ========== ОТОБРАЖЕНИЕ ВКЛАДКИ С ЗАЯВКАМИ ==========
    function renderListingsTab() {
        const pendingListings = getPendingListings();

        document.getElementById('listingsStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${pendingListings.length}</div><div>Заявок на рассмотрении</div></div>
            <div class="stat-card"><div class="stat-number">${pendingListings.filter(l => l.status === 'pending').length}</div><div>Ожидают проверки</div></div>
        `;

        if (pendingListings.length === 0) {
            document.getElementById('listingsTableBody').innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">Нет заявок от хозяев</td></tr>';
            return;
        }

        document.getElementById('listingsTableBody').innerHTML = pendingListings.map(listing => `
            <tr>
                <td>${listing.id}</td>
                <td>${listing.userName}<br><small>${listing.userEmail}</small></td>
                <td>${listing.title}</td>
                <td>${listing.city}</td>
                <td><strong>${listing.price.toLocaleString()} ₽</strong></td>
                <td><img src="${listing.image}" class="listing-image-preview" onclick="viewImage('${listing.image}', '${listing.title}', '${listing.description.replace(/'/g, "\\'")}')" style="cursor: pointer;"></td>
                <td><span class="status-badge status-pending">На модерации</span></td>
                <td>
                    <button class="btn-approve" onclick="approveListing(${listing.id})">✅ Одобрить</button>
                    <button class="btn-reject" onclick="rejectListing(${listing.id})">❌ Отклонить</button>
                </td>
            </tr>
        `).join('');
    }

    // ========== ПРОСМОТР ФОТО ==========
    function viewImage(src, title, description) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        modalImg.src = src;
        modalTitle.textContent = title;
        modalDesc.textContent = description.substring(0, 200) + (description.length > 200 ? '...' : '');
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('imageModal').classList.remove('active');
    }

    // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
    const tabs = document.querySelectorAll('.admin-tab');
    const bookingsTab = document.getElementById('bookingsTab');
    const listingsTab = document.getElementById('listingsTab');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            if (tab.dataset.tab === 'bookings') {
                bookingsTab.classList.add('active');
                listingsTab.classList.remove('active');
                renderBookingsTab();
            } else {
                bookingsTab.classList.remove('active');
                listingsTab.classList.add('active');
                renderListingsTab();
            }
        });
    });

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    if (checkAdminAccess()) {
        renderBookingsTab();
        renderListingsTab();
    }

    window.approveListing = approveListing;
    window.rejectListing = rejectListing;
    window.updateBookingStatus = updateBookingStatus;
    window.deleteBooking = deleteBooking;
    window.viewImage = viewImage;
    window.closeModal = closeModal;
</script>
</body>
</html>
