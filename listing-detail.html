<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали объявления | BroSky</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #f0f6ff 0%, #e9f0fa 100%); }
        :root {
            --primary-blue: #2c7da0;
            --pure-white: #ffffff;
            --cool-gray: #5a6e7c;
            --charcoal: #2c3e44;
            --shadow-sm: 0 12px 28px rgba(0, 32, 64, 0.08);
            --shadow-hover: 0 20px 32px rgba(27, 65, 92, 0.12);
            --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
        header { padding: 24px 0 16px; backdrop-filter: blur(8px); background: rgba(255, 255, 255, 0.72); position: sticky; top: 0; z-index: 100; }
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.8rem; font-weight: 700; color: var(--charcoal); text-decoration: none; }
        .logo i { color: var(--primary-blue); font-size: 2rem; }
        .nav-links { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; font-weight: 500; color: var(--cool-gray); transition: var(--transition); }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-blue); }
        .btn-outline-light { border: 1.5px solid var(--primary-blue); background: transparent; padding: 8px 20px; border-radius: 40px; color: var(--primary-blue); font-weight: 600; text-decoration: none; }
        .breadcrumb { margin: 24px 0; font-size: 0.85rem; color: var(--cool-gray); }
        .detail-grid { display: grid; grid-template-columns: 1fr 400px; gap: 48px; margin: 32px 0 64px; }
        .gallery { background: white; border-radius: 32px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .main-image { width: 100%; height: 450px; overflow: hidden; position: relative; background: #d4e6f1; cursor: pointer; }
        .main-image img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.9); border: none;
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--charcoal); z-index: 20;
        }
        .gallery-nav.prev { left: 16px; }
        .gallery-nav.next { right: 16px; }
        .gallery-nav:hover { background: var(--primary-blue); color: white; }
        .image-counter { position: absolute; bottom: 16px; right: 16px; background: rgba(0,0,0,0.6); color: white; padding: 6px 12px; border-radius: 30px; font-size: 0.8rem; z-index: 20; }
        .thumbnail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; background: white; }
        .thumbnail { height: 80px; overflow: hidden; border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
        .thumbnail.active { border-color: var(--primary-blue); }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; cursor: pointer; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 30px; font-size: 2rem; color: white; cursor: pointer; }
        .listing-info h1 { font-size: 2.2rem; font-weight: 700; color: var(--charcoal); margin-bottom: 12px; }
        .location { display: flex; align-items: center; gap: 8px; color: var(--cool-gray); margin-bottom: 20px; }
        .stars { color: #f5a623; letter-spacing: 2px; margin-bottom: 16px; }
        .features { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 0; border-top: 1px solid #eef2f7; border-bottom: 1px solid #eef2f7; margin-bottom: 24px; }
        .feature { display: flex; align-items: center; gap: 12px; }
        .feature i { font-size: 1.3rem; color: var(--primary-blue); width: 32px; }
        .description { margin-bottom: 32px; }
        .description h3 { font-size: 1.3rem; margin-bottom: 16px; }
        .description p { line-height: 1.7; color: var(--cool-gray); }
        .amenities { margin-bottom: 32px; }
        .amenities h3 { font-size: 1.3rem; margin-bottom: 16px; }
        .amenities-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .amenity { display: flex; align-items: center; gap: 12px; padding: 10px; background: #eef2f7; border-radius: 16px; }
        .amenity i { width: 24px; color: var(--primary-blue); }
        .booking-card { background: white; border-radius: 32px; padding: 28px; box-shadow: var(--shadow-sm); position: sticky; top: 100px; }
        .price { font-size: 2rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 8px; }
        .date-inputs { margin: 24px 0; }
        .date-group { margin-bottom: 16px; }
        .date-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
        .date-group input, .guests-select select { width: 100%; padding: 14px; border: 1px solid #d0dee9; border-radius: 20px; font-family: inherit; }
        .total-price { padding: 16px 0; border-top: 1px solid #eef2f7; border-bottom: 1px solid #eef2f7; margin-bottom: 24px; display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; }
        .btn-book { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 16px; border-radius: 48px; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-book:hover { background: #236e8a; transform: translateY(-2px); }
        .favorite-detail-btn { width: 100%; background: white; border: 1.5px solid var(--primary-blue); padding: 14px; border-radius: 48px; font-weight: 600; margin-top: 12px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .review-card { background: white; border-radius: 24px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .similar-section { margin: 64px 0; }
        .similar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; }
        .similar-card { background: white; border-radius: 24px; overflow: hidden; transition: var(--transition); cursor: pointer; text-decoration: none; color: inherit; }
        .similar-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
        .similar-image { height: 180px; overflow: hidden; }
        .similar-image img { width: 100%; height: 100%; object-fit: cover; }
        .similar-info { padding: 16px; }
        .similar-title { font-weight: 600; margin-bottom: 8px; }
        .similar-price { color: var(--primary-blue); font-weight: 700; }
        footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(44, 125, 160, 0.2); margin-top: 40px; color: var(--cool-gray); }
        @media (max-width: 992px) { .detail-grid { grid-template-columns: 1fr; } .booking-card { position: static; } }
        @media (max-width: 768px) { .container { padding: 0 20px; } .navbar { flex-direction: column; } .main-image { height: 300px; } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="BroSky" style="height: 60px; width: auto;">
                <span>BroSky</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Жильё</a>
                <a href="favorites.html">Избранное</a>
                <a href="contact.html">Контакты</a>
                <a href="login.html" class="btn-outline-light"><i class="far fa-user"></i> Войти</a>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="breadcrumb"><a href="index.html">Главная</a> <span>/</span> <a href="catalog.html">Жильё</a> <span>/</span> <span id="breadcrumbTitle">...</span></div>
        <div class="detail-grid">
            <div>
                <div class="gallery">
                    <div class="main-image" onclick="openModal()">
                        <img id="mainImg" src="" alt="">
                        <button class="gallery-nav prev" onclick="changeImage(-1, event)">❮</button>
                        <button class="gallery-nav next" onclick="changeImage(1, event)">❯</button>
                        <div class="image-counter" id="imageCounter">1 / 0</div>
                    </div>
                    <div class="thumbnail-grid" id="thumbnailGrid"></div>
                </div>
                <div id="imageModal" class="modal" onclick="closeModal()">
                    <span class="modal-close" onclick="closeModal()">&times;</span>
                    <img id="modalImg" src="" alt="">
                    <button class="gallery-nav prev" onclick="changeModalImage(-1, event)">❮</button>
                    <button class="gallery-nav next" onclick="changeModalImage(1, event)">❯</button>
                </div>
                <div class="listing-info">
                    <h1 id="listingTitle">Загрузка...</h1>
                    <div class="location"><i class="fas fa-map-marker-alt"></i> <span id="listingLocation"></span></div>
                    <div class="stars" id="listingStars">★★★★★</div>
                    <div class="features" id="listingFeatures"></div>
                    <div class="description"><h3>Описание</h3><p id="listingDescription"></p></div>
                    <div class="amenities"><h3>Удобства</h3><div class="amenities-grid" id="amenitiesGrid"></div></div>
                </div>
                <div class="reviews-section"><h3>Отзывы гостей</h3><div id="reviewsList"></div></div>
            </div>
            <div>
                <div class="booking-card">
                    <div class="price"><span id="listingPrice"></span><span>/ сутки</span></div>
                    <div class="date-inputs">
                        <div class="date-group"><label>Заезд</label><input type="date" id="checkinDate"></div>
                        <div class="date-group"><label>Выезд</label><input type="date" id="checkoutDate"></div>
                    </div>
                    <div class="guests-select"><label>Гости</label><select id="guestsCount"><option value="1">1 гость</option><option value="2" selected>2 гостя</option><option value="3">3 гостя</option><option value="4">4 гостя</option><option value="5">5 гостей</option><option value="6">6 гостей</option></select></div>
                    <div class="total-price"><span>Итого:</span><span id="totalAmount">0 ₽</span></div>
                    <button class="btn-book" onclick="bookNow()"><i class="fas fa-calendar-check"></i> Забронировать</button>
                    <button class="favorite-detail-btn" id="favoriteBtn" onclick="toggleFavoriteDetail()"><i class="far fa-heart"></i> В избранное</button>
                </div>
            </div>
        </div>
        <div class="similar-section"><h3>Похожие объявления</h3><div class="similar-grid" id="similarGrid"></div></div>
    </div>
</main>
<footer><div class="container"><p><i class="fas fa-dove"></i> BroSky — аренда без хлопот. © 2025</p></div></footer>

<script>
    const listingsData = {
        1: {
            id: 1, title: "Светлая студия в центре", location: "Москва, ул. Тверская", price: 4500,
            beds: 1, baths: 1, guests: 2, type: "apartment", city: "Москва",
            description: "Просторная светлая студия в самом центре Москвы. Всего в 5 минутах от метро. В квартире есть всё необходимое: современная техника, удобная кровать, быстрый Wi-Fi.",
            amenities: ["Wi-Fi", "Кухня", "Телевизор", "Кондиционер", "Стиральная машина", "Утюг", "Фен"],
            images: [
                "images/apartments/apartment-2.jpg",
                "images/apartments/apartment-3.jpg",
                "images/apartments/apartment-4.jpg",
            ],
            rating: 4.8, reviews: 124,
            reviewsList: [{ name: "Анна", date: "15 марта 2025", rating: 5, text: "Отличная квартира! Чисто, уютно." }]
        },
        2: {
            id: 2, title: "Дизайнерский лофт", location: "СПб, Невский пр.", price: 6800,
            beds: 2, baths: 1, guests: 4, type: "loft", city: "СПб",
            description: "Стильный лофт на Невском проспекте. Высокие потолки, панорамные окна, дизайнерский ремонт. Рядом основные достопримечательности.",
            amenities: ["Wi-Fi", "Кухня", "Телевизор", "Кондиционер", "Посудомойка", "Кофемашина"],
            images: [
                "images/dloft/dloft-2.jpg",
                "images/dloft/dloft-3.jpg",
            ],
            rating: 4.9, reviews: 89, reviewsList: []
        },
        3: {
            id: 3, title: "Коттедж с садом", location: "Сочи, Адлерский р-н", price: 12000,
            beds: 3, baths: 2, guests: 6, type: "house", city: "Сочи",
            description: "Уютный двухэтажный коттедж с собственным садом. Идеальное место для семейного отдыха. Есть мангал и зона барбекю.",
            amenities: ["Wi-Fi", "Кухня", "Телевизор", "Кондиционер", "Сауна", "Мангал", "Парковка"],
            images: [
                "images/kotteg/kotteg-2.jpg",
                "himages/kotteg/kotteg-3.jpg",
            ],
            rating: 4.7, reviews: 56, reviewsList: []
        },
        4: {
            id: 4, title: "Уютная двушка", location: "Казань, ул. Баумана", price: 3200,
            beds: 2, baths: 1, guests: 4, type: "apartment", city: "Казань",
            description: "Уютная квартира в историческом центре Казани. Рядом Кремль и пешеходная улица Баумана.",
            amenities: ["Wi-Fi", "Кухня", "Телевизор", "Стиральная машина", "Фен"],
            images: [
                "images/uyutnaya2/uyutnaya2-2.jpg",
                "images/uyutnaya2/uyutnaya2-3.jpg"
            ],
            rating: 4.6, reviews: 203, reviewsList: []
        },
        5: {
            id: 5, title: "Loft с панорамным видом", location: "Москва, Москва-Сити", price: 9500,
            beds: 2, baths: 2, guests: 4, type: "loft", city: "Москва",
            description: "Впечатляющий лофт в башне Москва-Сити. Панорамный вид на город, современная мебель.",
            amenities: ["Wi-Fi", "Умный дом", "Кофеварка", "Телевизор", "Кондиционер", "Джакузи"],
            images: [
                "images/loftp/loftp-2.jpg",
                "images/loftp/loftp-3.jpg"
            ],
            rating: 4.95, reviews: 67, reviewsList: []
        },
        6: {
            id: 6, title: "Дом у моря", location: "Сочи, Лазаревское", price: 15000,
            beds: 4, baths: 2, guests: 8, type: "house", city: "Сочи",
            description: "Вилла с выходом к морю. Терраса с видом на море, собственный выход на пляж.",
            amenities: ["Wi-Fi", "Камин", "Барбекю", "Парковка", "Кондиционеры"],
            images: [
                "images/domumorya/domumorya-2.jpg",
                "images/domumorya/domumorya-3.jpg"
            ],
            rating: 4.85, reviews: 42, reviewsList: []
        }
    };

    let currentImageIndex = 0, currentImages = [];
    function getListingId() { return parseInt(new URLSearchParams(window.location.search).get('id')); }
    function getFavorites() { const f = localStorage.getItem('favoritesIds'); return f ? JSON.parse(f) : []; }
    function isFavorite(id) { return getFavorites().includes(id); }
    function showNotification(msg) { const n = document.createElement('div'); n.textContent = msg; n.style.cssText = `position:fixed;bottom:20px;right:20px;background:#2c3e44;color:white;padding:12px 24px;border-radius:48px;z-index:1000;animation:slideIn 0.3s ease;`; document.body.appendChild(n); setTimeout(() => { n.style.animation = 'slideOut 0.3s ease'; setTimeout(() => n.remove(), 300); }, 2000); }

    function toggleFavoriteDetail() {
        const id = getListingId(); let fav = getFavorites();
        if (fav.includes(id)) { fav = fav.filter(f => f !== id); showNotification('Удалено из избранного 💔'); }
        else { fav.push(id); showNotification('Добавлено в избранное! ❤️'); }
        localStorage.setItem('favoritesIds', JSON.stringify(fav));
        const btn = document.getElementById('favoriteBtn');
        if (isFavorite(id)) { btn.innerHTML = '<i class="fas fa-heart"></i> В избранном'; btn.style.background = '#ff6b6b'; btn.style.color = 'white'; }
        else { btn.innerHTML = '<i class="far fa-heart"></i> В избранное'; btn.style.background = 'white'; btn.style.color = 'var(--charcoal)'; }
    }

    function updateGallery() {
        if (!currentImages.length) return;
        document.getElementById('mainImg').src = currentImages[currentImageIndex];
        document.getElementById('imageCounter').innerHTML = `${currentImageIndex+1} / ${currentImages.length}`;
        document.querySelectorAll('.thumbnail').forEach((t,i) => { if(i===currentImageIndex) t.classList.add('active'); else t.classList.remove('active'); });
    }
    function changeImage(d, e) { if(e) e.stopPropagation(); if(currentImages.length) { currentImageIndex = (currentImageIndex + d + currentImages.length) % currentImages.length; updateGallery(); } }
    function setImage(i) { currentImageIndex = i; updateGallery(); }
    function openModal() { const modal = document.getElementById('imageModal'); document.getElementById('modalImg').src = currentImages[currentImageIndex]; modal.classList.add('active'); }
    function closeModal() { document.getElementById('imageModal').classList.remove('active'); }
    function changeModalImage(d, e) { if(e) e.stopPropagation(); if(currentImages.length) { currentImageIndex = (currentImageIndex + d + currentImages.length) % currentImages.length; document.getElementById('modalImg').src = currentImages[currentImageIndex]; updateGallery(); } }

    function calculateTotal() {
        const id = getListingId(), l = listingsData[id]; if(!l) return;
        let total = l.price;
        const ci = document.getElementById('checkinDate').value, co = document.getElementById('checkoutDate').value;
        if(ci && co) { const days = Math.max(1, Math.ceil((new Date(co)-new Date(ci))/(1000*60*60*24))); total = l.price * days; }
        document.getElementById('totalAmount').innerHTML = `${total.toLocaleString()} ₽`;
    }
    function bookNow() { const ci = document.getElementById('checkinDate').value; if(!ci) { showNotification('Выберите даты'); return; } alert('Бронирование оформлено! Спасибо за доверие к BroSky!'); }

    function loadListing() {
        const id = getListingId(), l = listingsData[id];
        if(!l) { window.location.href = 'catalog.html'; return; }
        currentImages = l.images; currentImageIndex = 0;
        document.title = `${l.title} | BroSky`;
        document.getElementById('breadcrumbTitle').innerHTML = l.title;
        document.getElementById('listingTitle').innerHTML = l.title;
        document.getElementById('listingLocation').innerHTML = l.location;
        document.getElementById('listingPrice').innerHTML = l.price.toLocaleString();
        document.getElementById('listingDescription').innerHTML = l.description;
        const full = Math.floor(l.rating);
        document.getElementById('listingStars').innerHTML = '★'.repeat(full) + '☆'.repeat(5-full);
        document.getElementById('listingFeatures').innerHTML = `<div class="feature"><i class="fas fa-bed"></i><span>${l.beds} спальни</span></div><div class="feature"><i class="fas fa-bath"></i><span>${l.baths} ванная</span></div><div class="feature"><i class="fas fa-users"></i><span>до ${l.guests} гостей</span></div>`;
        document.getElementById('amenitiesGrid').innerHTML = l.amenities.map(a => `<div class="amenity"><i class="fas fa-check-circle"></i> ${a}</div>`).join('');
        updateGallery();
        document.getElementById('thumbnailGrid').innerHTML = l.images.map((img,i) => `<div class="thumbnail ${i===0?'active':''}" onclick="setImage(${i})"><img src="${img}" alt="Фото ${i+1}"></div>`).join('');
        document.getElementById('reviewsList').innerHTML = l.reviewsList.length ? l.reviewsList.map(r => `<div class="review-card"><div class="review-header"><span>${r.name}</span><span>${r.date}</span></div><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div>${r.text}</div></div>`).join('') : '<div class="review-card">Пока нет отзывов</div>';
        const similar = Object.values(listingsData).filter(i => i.id !== id && (i.type === l.type || i.city === l.city)).slice(0,3);
        document.getElementById('similarGrid').innerHTML = similar.map(s => `<div class="similar-card" onclick="window.location.href='listing-detail.html?id=${s.id}'"><div class="similar-image"><img src="${s.images[0]}" alt="${s.title}"></div><div class="similar-info"><div class="similar-title">${s.title}</div><div class="similar-price">${s.price.toLocaleString()} ₽/сутки</div></div></div>`).join('');
        const btn = document.getElementById('favoriteBtn');
        if(isFavorite(id)) { btn.innerHTML = '<i class="fas fa-heart"></i> В избранном'; btn.style.background = '#ff6b6b'; btn.style.color = 'white'; }
        else { btn.innerHTML = '<i class="far fa-heart"></i> В избранное'; btn.style.background = 'white'; btn.style.color = 'var(--charcoal)'; }
        const t = new Date(); const t2 = new Date(); t2.setDate(t2.getDate()+3);
        document.getElementById('checkinDate').value = new Date(t.setDate(t.getDate()+1)).toISOString().split('T')[0];
        document.getElementById('checkoutDate').value = t2.toISOString().split('T')[0];
        document.getElementById('checkinDate').addEventListener('change', calculateTotal);
        document.getElementById('checkoutDate').addEventListener('change', calculateTotal);
        calculateTotal();
    }

    window.changeImage = changeImage; window.setImage = setImage; window.openModal = openModal; window.closeModal = closeModal;
    window.changeModalImage = changeModalImage; window.bookNow = bookNow; window.toggleFavoriteDetail = toggleFavoriteDetail;
    loadListing();
</script>
</body>
</html>
